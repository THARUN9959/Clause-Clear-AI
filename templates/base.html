<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="ClauseClear AI — AI-powered contract analysis. Understand risks, obligations, and health scores for any legal contract.">
    <meta name="csrf-token" content="{{ csrf_token() }}">
    <title>{% block title %}ClauseClear AI{% endblock %}</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700;800&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- DOMPurify — sanitize all LLM output before innerHTML insertion -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.0.6/purify.min.js"></script>

    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">

    <!-- Apply theme BEFORE render to prevent flash -->
    <script>
        (function () {
            var t = localStorage.getItem('theme') || 'dark';
            document.documentElement.setAttribute('data-theme', t);
        })();
    </script>

    {% block head %}{% endblock %}
</head>
<body>
    <!-- Navigation -->
    <nav class="navbar" id="main-navbar">
        <div class="nav-container">
            <a href="{{ url_for('index') }}" class="nav-logo" id="nav-logo">
                <span class="logo-icon">⚖️</span>
                <span class="logo-text">ClauseClear <span class="logo-accent">AI</span></span>
            </a>
            <div class="nav-links" id="nav-links">
                <a href="{{ url_for('index') }}" class="nav-link {% if request.endpoint == 'index' %}active{% endif %}" id="nav-home">Home</a>
                <a href="{{ url_for('analyze') }}" class="nav-link {% if request.endpoint == 'analyze' %}active{% endif %}" id="nav-analyze">Analyze</a>
                <a href="{{ url_for('tools') }}" class="nav-link nav-link--tools {% if request.endpoint == 'tools' %}active{% endif %}" id="nav-tools">🛠️ Tools</a>
                <a href="{{ url_for('history') }}" class="nav-link {% if request.endpoint == 'history' %}active{% endif %}" id="nav-history">History</a>
            </div>
            <button class="theme-toggle-btn" id="theme-toggle-btn" aria-label="Toggle light/dark theme" title="Toggle theme">☀️</button>
            <button class="nav-toggle" id="nav-toggle" aria-label="Toggle navigation">
                <span></span><span></span><span></span>
            </button>
        </div>
    </nav>

    <!-- Toast container -->
    <div id="toast-container" aria-live="polite"></div>

    <!-- Main Content -->
    <main class="main-content">
        {% block content %}{% endblock %}
    </main>

    <!-- Footer -->
    <footer class="footer" id="main-footer">
        <div class="footer-content">
            <p>&copy; 2026 ClauseClear AI &mdash; Powered by Gemini AI &bull; For informational purposes only &mdash; not legal advice.</p>
        </div>
    </footer>

    <script src="{{ url_for('static', filename='js/app.js') }}"></script>
    {% block scripts %}{% endblock %}
</body>
</html>
